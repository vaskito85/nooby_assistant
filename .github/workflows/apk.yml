name: APK

# Compila el APK de Nooby (cáscara Android). Se corre solo en cada push que toque android/,
# o a mano desde la pestaña Actions ("Run workflow"). El APK queda en "Artifacts" de la corrida.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar (debug, firmado con la clave de debug)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nooby-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
