name: APK

# Compila el APK de Nooby (cáscara Android). Se corre solo en cada push que toque android/,
# o a mano desde la pestaña Actions ("Run workflow"). El APK queda en "Artifacts" de la corrida.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bajar el modelo de voz en español (Vosk, Apache-2.0)
        run: |
          curl -fsSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip
          unzip -q modelo.zip -d modelo-tmp
          mkdir -p android/app/src/main/assets
          mv modelo-tmp/vosk-model-small-es-0.42 android/app/src/main/assets/model-es
          # StorageService.unpack de Vosk necesita este archivo para saber si ya copió el modelo
          cat /proc/sys/kernel/random/uuid > android/app/src/main/assets/model-es/uuid
          du -sh android/app/src/main/assets/model-es

      - name: Compilar (debug, firmado con la clave de debug)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: nooby-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
